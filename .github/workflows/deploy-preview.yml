name: Deploy Preview (Vercel)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runner images ship an npm with a known bug that intermittently breaks
      # global installs; upgrading npm first makes this deterministic (docs/adr/0003).
      - name: Update npm (fix runner npm bug)
        run: npm install --global npm@latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel Git integration is disabled by design (docs/adr/0001): builds and
      # deploys are driven from CI via the CLI, and --prebuilt ships exactly the
      # artifact built in the previous step.
      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const raw = '${{ steps.deploy.outputs.url }}';
            const body = '🔍 **Preview:** https://' + raw.replace(/^https?:\/\//, '');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('**Preview:**'));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.pull_request.number, body });
            }

      - name: Notify Telegram
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="🔍"; else ICON="❌"; fi
          MSG="$ICON Preview PR #${{ github.event.pull_request.number }}: ${{ steps.deploy.outputs.url }} — $PR_TITLE"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MSG" > /dev/null
