name: Deploy RC staging (rc.no-way.dev)

on:
  push:
    branches: [rc]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runner images ship an npm with a known bug that intermittently breaks
      # global installs; upgrading npm first makes this deterministic (docs/adr/0003).
      - name: Update npm (fix runner npm bug)
        run: npm install --global npm@latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel Git integration is disabled by design (docs/adr/0001): builds and
      # deploys are driven from CI via the CLI, and --prebuilt ships exactly the
      # artifact built in the previous step.
      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy staging
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Alias to rc.no-way.dev
        run: vercel alias set "${{ steps.deploy.outputs.url }}" rc.no-way.dev --token=${{ secrets.VERCEL_TOKEN }}

      # Staging must stay out of search indexes. The header comes from vercel.json
      # `has` host conditions — which combine with AND (a past incident, see
      # docs/adr/0004) — so we verify the live header instead of trusting config.
      - name: Verify noindex header on rc.no-way.dev
        run: |
          for i in 1 2 3; do
            if curl -sI https://rc.no-way.dev/ | grep -i "x-robots-tag"; then
              exit 0
            fi
            echo "attempt $i: X-Robots-Tag header missing, retrying in 15s..."
            sleep 15
          done
          echo "::error::X-Robots-Tag header missing on https://rc.no-way.dev/ after 3 attempts"
          exit 1

      - name: Notify Telegram
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="🧪"; else ICON="❌"; fi
          MSG="$ICON RC-стейджинг: $STATUS → https://rc.no-way.dev — $COMMIT_MSG"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MSG" > /dev/null
