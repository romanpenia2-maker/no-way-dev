name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runner images ship an npm with a known bug that intermittently breaks
      # `npm ci`; upgrading npm first makes installs deterministic (docs/adr/0003).
      - name: Update npm (fix runner npm bug)
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data
        run: npm run validate-data

      - name: Build
        run: npm run build
