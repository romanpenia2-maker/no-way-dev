name: Telegram notify (agent → owner)

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Message text (or photo caption when image_path is set)"
        required: true
        type: string
      image_path:
        description: "Optional repo path to an image; sent via sendDocument (full resolution, no TG compression) with text as caption"
        required: false
        type: string
        default: ""
      image_ref:
        description: "Git ref to fetch image_path from (default: the ref this run was dispatched on)"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Download image from repo via Contents API
        if: ${{ inputs.image_path != '' }}
        env:
          BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          IMG: ${{ inputs.image_path }}
          IMG_REF: ${{ inputs.image_ref != '' && inputs.image_ref || github.ref_name }}
        run: |
          curl -sSfL -o doc.bin \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$IMG?ref=$IMG_REF"
          ls -la doc.bin

      - name: Send photo to owner TG panel
        if: ${{ inputs.image_path != '' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ inputs.text }}
          IMG: ${{ inputs.image_path }}
        run: |
          fname=$(basename "$IMG")
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
            -F "chat_id=$OWNER_CHAT" \
            -F "document=@doc.bin;filename=$fname" \
            -F "caption=$TEXT" > resp.json
          python3 -c "import json; d=json.load(open('resp.json')); print('telegram ok:', d.get('ok')); exit(0 if d.get('ok') else 1)"

      - name: Send message to owner TG panel
        if: ${{ inputs.image_path == '' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ inputs.text }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$OWNER_CHAT" --data-urlencode "text=$TEXT" \
            -d "disable_web_page_preview=true" > resp.json
          python3 -c "import json; d=json.load(open('resp.json')); print('telegram ok:', d.get('ok')); exit(0 if d.get('ok') else 1)"
