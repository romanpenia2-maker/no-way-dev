name: One-off — push detector API keys to Vercel env

on:
  workflow_dispatch:

permissions: {}

jobs:
  set-env:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      SIGHTENGINE_USER: ${{ secrets.SIGHTENGINE_USER }}
      SIGHTENGINE_SECRET: ${{ secrets.SIGHTENGINE_SECRET }}
    steps:
      - name: Upsert env vars via Vercel REST API
        run: |
          set -e
          PROJ=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/no-way-dev" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "project: $PROJ"
          upsert() {
            local KEY="$1" VAL="$2"
            EXISTING=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$PROJ/env"               | python3 -c "import sys,json;print('\n'.join(e['id'] for e in json.load(sys.stdin).get('envs',[]) if e['key']=='$KEY' and 'preview' in e.get('target',[])))")
            for EID in $EXISTING; do
              curl -s -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$PROJ/env/$EID" > /dev/null
            done
            curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json"               -d "{"key":"$KEY","value":"$VAL","type":"sensitive","target":["preview"]}"               "https://api.vercel.com/v10/projects/$PROJ/env?upsert=true" | python3 -c "import sys,json;d=json.load(sys.stdin);print('$KEY ->', json.dumps(d)[:300])"
          }
          upsert DEEPINFRA_API_KEY "$DEEPINFRA_API_KEY"
          upsert SIGHTENGINE_USER "$SIGHTENGINE_USER"
          upsert SIGHTENGINE_SECRET "$SIGHTENGINE_SECRET"
