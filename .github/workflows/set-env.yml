name: One-off — push detector API keys to Vercel env

on:
  workflow_dispatch:

permissions: {}

jobs:
  set-env:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      SIGHTENGINE_USER: ${{ secrets.SIGHTENGINE_USER }}
      SIGHTENGINE_SECRET: ${{ secrets.SIGHTENGINE_SECRET }}
      SIGHTENGINE_API_USER: ${{ secrets.SIGHTENGINE_USER }}
      SIGHTENGINE_API_SECRET: ${{ secrets.SIGHTENGINE_SECRET }}
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - name: Upsert env vars via Vercel REST API
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          T = os.environ["VERCEL_TOKEN"]
          def api(method, path, payload=None):
              req = urllib.request.Request(
                  "https://api.vercel.com" + path, method=method,
                  headers={"Authorization": "Bearer " + T, "Content-Type": "application/json"},
                  data=json.dumps(payload).encode() if payload is not None else None)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          proj = api("GET", "/v9/projects/no-way-dev")
          pid = proj["id"]
          print("project:", pid)

          envs = api("GET", f"/v10/projects/{pid}/env").get("envs", [])
          for key in ("DEEPINFRA_API_KEY", "SIGHTENGINE_USER", "SIGHTENGINE_SECRET", "SIGHTENGINE_API_USER", "SIGHTENGINE_API_SECRET", "DATA_REPO_TOKEN"):
              val = os.environ[key]
              for e in [e for e in envs if e.get("key") == key and "preview" in (e.get("target") or [])]:
                  api("DELETE", f"/v10/projects/{pid}/env/{e['id']}")
              res = api("POST", f"/v10/projects/{pid}/env?upsert=true",
                        {"key": key, "value": val, "type": "sensitive", "target": ["preview", "production"]})
              print(key, "-> preview OK:", res.get("key"), res.get("target"))
          PYEOF
